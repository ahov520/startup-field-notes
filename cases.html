<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="description" content="创业坟场全量档案 · 314 条案例" />
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <title>档案 · 创业坟场笔记</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700;800&family=Space+Grotesk:wght@500;600;700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/app.css" />
</head>
<body class="page-cases">
  <div class="progress" id="progress" aria-hidden="true"></div>
  <div class="ticker" aria-hidden="true">
    <div class="ticker__track">GRAVEYARD · 314 CASES · FAIL · SURVIVE · PIVOT · 🪦 · GRAVEYARD · 314 CASES · </div>
  </div>

  <header class="top">
    <a class="brand" href="index.html"><span class="brand__mark">🪦</span><span class="brand__text">创业坟场笔记</span></a>
    <span class="top__link mono" id="caseCount">314</span>
  </header>

  <main>
    <section class="hero hero--compact">
      <span class="sticker">CASE ARCHIVE</span>
      <h1>全量<strong>坟场</strong></h1>
      <p class="hero__lead">每张碑可点开：经历、死因、寿命、资金、出处</p>
    </section>

    <section class="panel sticky-panel">
      <label class="search">
        <span aria-hidden="true">⌕</span>
        <input id="q" type="search" placeholder="搜公司 / 死因 / 国家…" autocomplete="off" />
      </label>
      <div class="pills" id="filters">
        <button type="button" class="pill is-on" data-f="all">全部</button>
        <button type="button" class="pill" data-f="失败">关停</button>
        <button type="button" class="pill" data-f="成功">存活</button>
        <button type="button" class="pill" data-f="转型">转型</button>
        <button type="button" class="pill" data-f="国内">国内</button>
        <button type="button" class="pill" data-f="海外">海外</button>
      </div>
      <div class="pills" id="sortPills" style="margin-top:8px">
        <button type="button" class="pill is-on" data-s="default">默认</button>
        <button type="button" class="pill" data-s="fail">关停优先</button>
        <button type="button" class="pill" data-s="story">有经历优先</button>
      </div>
      <div class="cause-row" id="causeRow" aria-label="死因筛选"></div>
      <p class="muted mono" id="resultMeta"></p>
    </section>

    <section class="section">
      <div class="tomb-grid" id="grid"></div>
      <p class="empty" id="empty" hidden>没有匹配的碑。</p>
    </section>
  </main>

  <aside class="drawer" id="drawer" hidden>
    <div class="drawer__scrim" data-close></div>
    <div class="drawer__panel" role="dialog" aria-modal="true">
      <button type="button" class="drawer__x" data-close aria-label="关闭">×</button>
      <div id="drawerBody"></div>
    </div>
  </aside>

  <footer class="foot">
    <div>
      <strong>档案</strong>
      <p>数据来自公开报道与一手文章，标注出处</p>
    </div>
    <a class="btn" href="index.html">回首页</a>
  </footer>

  <button type="button" class="fab-top" id="toTop" aria-label="回到顶部">↑</button>

  <nav class="tabbar" aria-label="主导航">
    <a href="index.html"><span>⌂</span>首页</a>
    <a class="is-on" href="cases.html"><span>▦</span>档案</a>
    <a href="index.html#weekly"><span>☰</span>本周</a>
    <a href="index.html#lexicon"><span>⚒</span>词典</a>
  </nav>

  <script src="js/cases.js" defer></script>
</body>
</html>
